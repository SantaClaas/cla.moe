name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Build pull requests too so broken content is caught before it reaches main
  pull_request:
    branches: ["**"]
  # Allows a manual redeploy from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Let a running deployment finish instead of cancelling it, but keep only the
# most recent queued run per branch so pushes in quick succession (for example
# several Pages CMS saves) don't pile up.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pnpm
        # v6.1.0
        # Version comes from the `packageManager` field in package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Install Node.js
        # v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          package-manager-cache: false # Slower, but no cache poisoning risk
      - name: Install dependencies
        # Build scripts stay enabled because esbuild has to unpack its binary.
        # pnpm only runs the ones allowed by `allowBuilds` in pnpm-workspace.yaml.
        run: pnpm install --frozen-lockfile
      - name: Build the site
        run: pnpm build
      - name: Upload the site as a Pages artifact
        # v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy: # Separate job so build-time dependencies can't deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write # Only this job may publish to Pages
      id-token: write # Verifies the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
