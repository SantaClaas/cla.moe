media:
  # The first entry is the default for fields that don't name one.
  - name: public
    label: Public
    input: public
    output: /
  # Post images live in src/assets so Astro optimizes them. Posts are in
  # src/content/blog, so they link to these images as ../../assets/blog/<file>.
  - name: blog
    label: Blog images
    input: src/assets/blog
    output: ../../assets/blog
  - name: assets
    label: Site assets
    input: public/assets
    output: /assets
content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/blog
    view:
      fields: [ title, draft, pubDatetime ]
    fields:
      - { name: author, label: Author, type: string }
      - { name: pubDatetime, label: Published, type: date, required: true }
      - { name: modDatetime, label: Modified, type: date }
      - { name: title, label: Title, type: string, required: true }
      - { name: ogImage, label: OG image, type: string }
      - { name: slug, label: Slug, type: string }
      - { name: featured, label: Featured, type: boolean }
      - { name: draft, label: Draft, type: boolean }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: description, label: Description, type: string }
      - { name: body, label: Body, type: rich-text, options: { media: blog } }
  - name: about
    label: About page
    type: file
    path: src/pages/about.md
    fields:
      - { name: layout, type: string, hidden: true, default: "../layouts/AboutLayout.astro" }
      - { name: title, label: Title, type: string }
      - { name: body, label: Body, type: rich-text, options: { media: assets } }
